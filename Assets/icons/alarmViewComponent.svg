<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32"
	xmlns="http://www.w3.org/2000/svg">
	<!-- Define gradient and filter -->
	<defs>
		<linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" style="stop-color:#2ecc71"/>
			<stop offset="100%" style="stop-color:#27ae60"/>
		</linearGradient>
		<filter id="dropShadow">
			<feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.1"/>
		</filter>
	</defs>

	<!-- Main panel background -->
	<rect x="4" y="4" width="24" height="24" rx="4" fill="url(#greenGradient)" stroke="#219a52" stroke-width="1.5" filter="dropShadow"/>

	<!-- Alarm entries -->
	<rect x="6" y="6" width="20" height="6" rx="2" fill="#ffeeee" stroke="#219a52" stroke-width="1.5"/>
	<circle cx="8" cy="9" r="1" fill="#ff4040"/>
	<line x1="11" y1="9" x2="24" y2="9" stroke="#219a52" stroke-width="1.5"/>

	<rect x="6" y="13" width="20" height="6" rx="2" fill="#fff6ee" stroke="#219a52" stroke-width="1.5"/>
	<circle cx="8" cy="16" r="1" fill="#ff8040"/>
	<line x1="11" y1="16" x2="24" y2="16" stroke="#219a52" stroke-width="1.5"/>

	<rect x="6" y="20" width="20" height="6" rx="2" fill="#eeeeff" stroke="#219a52" stroke-width="1.5"/>
	<circle cx="8" cy="23" r="1" fill="#4040ff"/>
	<line x1="11" y1="23" x2="24" y2="23" stroke="#219a52" stroke-width="1.5"/>
</svg>