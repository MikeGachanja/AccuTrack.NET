<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Alarm bell with alert indicator -->
  <!-- Bell shape -->
  <path d="M 50 15 L 40 25 Q 35 30, 35 40 Q 35 50, 40 55 L 60 55 Q 65 50, 65 40 Q 65 30, 60 25 Z" 
        fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <path d="M 50 15 L 40 25 Q 35 30, 35 40 Q 35 50, 40 55 L 60 55 Q 65 50, 65 40 Q 65 30, 60 25 Z" 
        fill="#C0392B" opacity="0.3"/>
  
  <!-- Bell clapper -->
  <ellipse cx="50" cy="45" rx="3" ry="5" fill="#2C3E50"/>
  <line x1="50" y1="50" x2="50" y2="60" stroke="#2C3E50" stroke-width="2"/>
  
  <!-- Alert waves -->
  <circle cx="50" cy="50" r="25" fill="none" stroke="#E74C3C" stroke-width="2" opacity="0.4" stroke-dasharray="3,3"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#E74C3C" stroke-width="2" opacity="0.3" stroke-dasharray="3,3"/>
  
  <!-- Exclamation mark -->
  <rect x="48" y="30" width="4" height="12" rx="2" fill="#FFFFFF"/>
  <circle cx="50" cy="46" r="2" fill="#FFFFFF"/>
  
  <!-- Base/platform -->
  <rect x="35" y="70" width="30" height="8" rx="2" fill="#7F8C8D"/>
  <rect x="38" y="78" width="24" height="4" rx="1" fill="#95A5A6"/>
</svg>
