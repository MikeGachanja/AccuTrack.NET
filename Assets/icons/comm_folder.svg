<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Folder with communication/network icon -->
  <!-- Folder body -->
  <path d="M 20 25 L 20 70 L 80 70 L 80 35 L 55 35 L 50 25 Z" 
        fill="#F39C12" stroke="#E67E22" stroke-width="2"/>
  <path d="M 20 25 L 50 25 L 55 35 L 20 35 Z" 
        fill="#E67E22" opacity="0.7"/>
  
  <!-- Folder tab -->
  <path d="M 25 25 L 45 25 L 50 30 L 25 30 Z" 
        fill="#F5B041" stroke="#E67E22" stroke-width="1"/>
  
  <!-- Network/communication icon inside folder -->
  <circle cx="40" cy="48" r="5" fill="#3498DB"/>
  <circle cx="60" cy="48" r="5" fill="#2ECC71"/>
  <circle cx="50" cy="58" r="5" fill="#E74C3C"/>
  <line x1="40" y1="48" x2="50" y2="58" stroke="#7F8C8D" stroke-width="1.5" opacity="0.6"/>
  <line x1="60" y1="48" x2="50" y2="58" stroke="#7F8C8D" stroke-width="1.5" opacity="0.6"/>
  <line x1="40" y1="48" x2="60" y2="48" stroke="#7F8C8D" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Signal waves -->
  <path d="M 30 48 Q 32 46, 34 48" stroke="#3498DB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 66 48 Q 68 46, 70 48" stroke="#2ECC71" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Base -->
  <rect x="35" y="70" width="30" height="6" rx="1" fill="#7F8C8D"/>
</svg>
