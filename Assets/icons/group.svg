<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
    <!-- Define gradient and filter -->
    <defs>
        <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4a90e2"/>
            <stop offset="100%" style="stop-color:#357abd"/>
        </linearGradient>
        <filter id="dropShadow">
            <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2"/>
        </filter>
    </defs>

    <!-- Background squares representing grouped components -->
    <rect x="4" y="4" width="10" height="10" fill="#ffffff" stroke="#2c5c8f" stroke-width="1.5" rx="4" filter="url(#dropShadow)"/>
    <rect x="18" y="4" width="10" height="10" fill="#ffffff" stroke="#2c5c8f" stroke-width="1.5" rx="4" filter="url(#dropShadow)"/>
    <rect x="4" y="18" width="10" height="10" fill="#ffffff" stroke="#2c5c8f" stroke-width="1.5" rx="4" filter="url(#dropShadow)"/>
    <rect x="18" y="18" width="10" height="10" fill="#ffffff" stroke="#2c5c8f" stroke-width="1.5" rx="4" filter="url(#dropShadow)"/>

    <!-- Selection outline representing the group -->
    <rect x="2" y="2" width="28" height="28" fill="none" stroke="url(#blueGradient)" stroke-width="1.5" stroke-dasharray="2,2" rx="4"/>

    <!-- Link lines between components -->
    <line x1="14" y1="9" x2="18" y2="9" stroke="#2c5c8f" stroke-width="1.5"/>
    <line x1="9" y1="14" x2="9" y2="18" stroke="#2c5c8f" stroke-width="1.5"/>
    <line x1="23" y1="14" x2="23" y2="18" stroke="#2c5c8f" stroke-width="1.5"/>
    <line x1="14" y1="23" x2="18" y2="23" stroke="#2c5c8f" stroke-width="1.5"/>
</svg> 