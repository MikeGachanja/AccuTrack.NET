<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Database/archive representation for historical data -->
  <!-- Database cylinder -->
  <ellipse cx="50" cy="25" rx="30" ry="8" fill="#34495E" stroke="#2C3E50" stroke-width="2"/>
  <rect x="20" y="25" width="60" height="40" fill="#2C3E50" stroke="#34495E" stroke-width="2"/>
  <ellipse cx="50" cy="65" rx="30" ry="8" fill="#1A252F" stroke="#2C3E50" stroke-width="2"/>
  
  <!-- Data storage layers -->
  <ellipse cx="50" cy="35" rx="28" ry="6" fill="#34495E" opacity="0.6"/>
  <ellipse cx="50" cy="45" rx="28" ry="6" fill="#34495E" opacity="0.6"/>
  <ellipse cx="50" cy="55" rx="28" ry="6" fill="#34495E" opacity="0.6"/>
  
  <!-- Data flow arrows (in and out) -->
  <path d="M 15 40 L 20 40" stroke="#3498DB" stroke-width="2" fill="none" marker-end="url(#arrowIn)"/>
  <path d="M 80 40 L 85 40" stroke="#2ECC71" stroke-width="2" fill="none" marker-end="url(#arrowOut)"/>
  
  <!-- Chart/graph representation -->
  <polyline points="25,60 30,55 35,58 40,50 45,52 50,45 55,48 60,42 65,44 70,38" 
            stroke="#3498DB" stroke-width="2" fill="none"/>
  <circle cx="25" cy="60" r="2" fill="#3498DB"/>
  <circle cx="70" cy="38" r="2" fill="#3498DB"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowIn" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498DB"/>
    </marker>
    <marker id="arrowOut" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2ECC71"/>
    </marker>
  </defs>
  
  <!-- Base -->
  <rect x="35" y="75" width="30" height="6" rx="1" fill="#7F8C8D"/>
</svg>
