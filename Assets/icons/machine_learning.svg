<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Neural Network / Brain representation -->
  <!-- Main brain shape -->
  <ellipse cx="50" cy="40" rx="30" ry="25" fill="#34495E" stroke="#2C3E50" stroke-width="2"/>
  <ellipse cx="50" cy="40" rx="25" ry="20" fill="#2C3E50"/>
  
  <!-- Neural network nodes -->
  <circle cx="35" cy="30" r="4" fill="#3498DB"/>
  <circle cx="50" cy="25" r="4" fill="#3498DB"/>
  <circle cx="65" cy="30" r="4" fill="#3498DB"/>
  <circle cx="40" cy="40" r="4" fill="#2ECC71"/>
  <circle cx="50" cy="40" r="4" fill="#2ECC71"/>
  <circle cx="60" cy="40" r="4" fill="#2ECC71"/>
  <circle cx="35" cy="50" r="4" fill="#E74C3C"/>
  <circle cx="50" cy="55" r="4" fill="#E74C3C"/>
  <circle cx="65" cy="50" r="4" fill="#E74C3C"/>
  
  <!-- Connection lines (neural network connections) -->
  <line x1="35" y1="30" x2="40" y2="40" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="25" x2="50" y2="40" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="65" y1="30" x2="60" y2="40" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="40" x2="35" y2="50" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="40" x2="50" y2="55" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="40" x2="65" y2="50" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  
  <!-- Data flow arrows -->
  <path d="M 20 50 L 30 50" stroke="#3498DB" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 70 50 L 80 50" stroke="#2ECC71" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498DB"/>
    </marker>
  </defs>
  
  <!-- Base/platform -->
  <rect x="15" y="75" width="70" height="8" rx="2" fill="#7F8C8D"/>
  <rect x="20" y="83" width="60" height="4" rx="1" fill="#95A5A6"/>
</svg>
