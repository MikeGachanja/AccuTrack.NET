<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- PC Tower/Case -->
  <rect x="20" y="15" width="35" height="70" rx="2" fill="#34495E" stroke="#2C3E50" stroke-width="2"/>
  <!-- Front panel -->
  <rect x="22" y="17" width="31" height="66" fill="#2C3E50"/>
  <!-- Power button -->
  <circle cx="37.5" cy="30" r="3" fill="#E74C3C"/>
  <!-- USB ports -->
  <rect x="25" y="50" width="8" height="3" fill="#7F8C8D"/>
  <rect x="25" y="55" width="8" height="3" fill="#7F8C8D"/>
  <!-- Monitor -->
  <rect x="60" y="20" width="35" height="25" rx="2" fill="#34495E" stroke="#2C3E50" stroke-width="2"/>
  <rect x="62" y="22" width="31" height="21" fill="#1A252F"/>
  <!-- Monitor stand -->
  <rect x="75" y="45" width="5" height="8" fill="#7F8C8D"/>
  <rect x="70" y="50" width="15" height="3" rx="1" fill="#95A5A6"/>
  <!-- Network indicator -->
  <circle cx="88" cy="28" r="2" fill="#3498DB"/>
</svg>
