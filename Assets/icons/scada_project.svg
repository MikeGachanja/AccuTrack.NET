<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- SCADA project - control system representation -->
  <!-- Main control panel -->
  <rect x="15" y="20" width="70" height="55" rx="3" fill="#34495E" stroke="#2C3E50" stroke-width="2"/>
  <rect x="17" y="22" width="66" height="51" fill="#2C3E50"/>
  
  <!-- Control panel header -->
  <rect x="15" y="20" width="70" height="12" rx="3" fill="#3498DB"/>
  <text x="50" y="29" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">SCADA</text>
  
  <!-- Control buttons/indicators -->
  <circle cx="30" cy="42" r="5" fill="#2ECC71"/>
  <circle cx="50" cy="42" r="5" fill="#E74C3C"/>
  <circle cx="70" cy="42" r="5" fill="#F39C12"/>
  
  <!-- Status displays -->
  <rect x="25" y="52" width="15" height="8" rx="1" fill="#3498DB" opacity="0.7"/>
  <rect x="42" y="52" width="15" height="8" rx="1" fill="#2ECC71" opacity="0.7"/>
  <rect x="60" y="52" width="15" height="8" rx="1" fill="#E74C3C" opacity="0.7"/>
  
  <!-- Connection lines -->
  <line x1="10" y1="35" x2="15" y2="35" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="85" y1="35" x2="90" y2="35" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="2,2"/>
  
  <!-- Base/platform -->
  <rect x="30" y="75" width="40" height="8" rx="2" fill="#7F8C8D"/>
  <rect x="35" y="83" width="30" height="4" rx="1" fill="#95A5A6"/>
</svg>
