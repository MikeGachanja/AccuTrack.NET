<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Calendar/clock representation for schedules -->
  <!-- Calendar body -->
  <rect x="25" y="20" width="50" height="55" rx="3" fill="#34495E" stroke="#2C3E50" stroke-width="2"/>
  <rect x="27" y="22" width="46" height="51" fill="#2C3E50"/>
  
  <!-- Calendar header (month bar) -->
  <rect x="25" y="20" width="50" height="12" rx="3" fill="#3498DB"/>
  <text x="50" y="30" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">SCH</text>
  
  <!-- Calendar grid lines -->
  <line x1="35" y1="32" x2="35" y2="75" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="45" y1="32" x2="45" y2="75" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="55" y1="32" x2="55" y2="75" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="65" y1="32" x2="65" y2="75" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  
  <line x1="25" y1="42" x2="75" y2="42" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="25" y1="52" x2="75" y2="52" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="25" y1="62" x2="75" y2="62" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  
  <!-- Scheduled time indicators -->
  <circle cx="40" cy="47" r="3" fill="#2ECC71"/>
  <circle cx="50" cy="57" r="3" fill="#2ECC71"/>
  <circle cx="60" cy="67" r="3" fill="#2ECC71"/>
  
  <!-- Clock hands overlay -->
  <circle cx="70" cy="35" r="8" fill="#E74C3C" opacity="0.8"/>
  <line x1="70" y1="35" x2="70" y2="30" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="35" x2="74" y2="35" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Base -->
  <rect x="30" y="75" width="40" height="6" rx="1" fill="#7F8C8D"/>
</svg>
