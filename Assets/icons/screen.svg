<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Screen/monitor representation -->
  <!-- Screen bezel -->
  <rect x="10" y="15" width="80" height="60" rx="3" fill="#34495E" stroke="#2C3E50" stroke-width="2"/>
  <!-- Screen frame -->
  <rect x="5" y="10" width="90" height="70" rx="5" fill="#2C3E50" stroke="#1A252F" stroke-width="1"/>
  <!-- Screen content area -->
  <rect x="15" y="20" width="70" height="50" fill="#1A252F"/>
  
  <!-- Screen content representation (UI elements) -->
  <rect x="20" y="25" width="25" height="8" rx="1" fill="#3498DB" opacity="0.6"/>
  <rect x="20" y="35" width="15" height="5" rx="1" fill="#2ECC71" opacity="0.6"/>
  <rect x="20" y="42" width="20" height="5" rx="1" fill="#E74C3C" opacity="0.6"/>
  
  <rect x="55" y="25" width="25" height="8" rx="1" fill="#3498DB" opacity="0.6"/>
  <rect x="55" y="35" width="15" height="5" rx="1" fill="#2ECC71" opacity="0.6"/>
  <rect x="55" y="42" width="20" height="5" rx="1" fill="#E74C3C" opacity="0.6"/>
  
  <!-- Stand/base -->
  <rect x="40" y="75" width="20" height="15" rx="2" fill="#7F8C8D"/>
  <rect x="35" y="80" width="30" height="5" rx="1" fill="#95A5A6"/>
  
  <!-- Status indicator -->
  <circle cx="85" cy="25" r="4" fill="#2ECC71"/>
</svg>
