<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Shield/lock representation for security -->
  <!-- Shield shape -->
  <path d="M 50 15 L 30 20 L 30 45 Q 30 55, 35 60 Q 40 65, 50 70 Q 60 65, 65 60 Q 70 55, 70 45 L 70 20 Z" 
        fill="#3498DB" stroke="#2980B9" stroke-width="2"/>
  <path d="M 50 15 L 30 20 L 30 45 Q 30 55, 35 60 Q 40 65, 50 70 Q 60 65, 65 60 Q 70 55, 70 45 L 70 20 Z" 
        fill="#2980B9" opacity="0.3"/>
  
  <!-- Lock body -->
  <rect x="40" y="35" width="20" height="20" rx="2" fill="#2C3E50" stroke="#1A252F" stroke-width="2"/>
  <rect x="42" y="37" width="16" height="16" fill="#34495E"/>
  
  <!-- Lock shackle -->
  <path d="M 45 35 Q 45 25, 50 25 Q 55 25, 55 35" 
        stroke="#2C3E50" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Keyhole -->
  <circle cx="50" cy="45" r="3" fill="#1A252F"/>
  <rect x="49" y="45" width="2" height="6" fill="#1A252F"/>
  
  <!-- Security checkmark -->
  <path d="M 45 50 L 48 53 L 55 46" 
        stroke="#2ECC71" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Base -->
  <rect x="40" y="75" width="20" height="6" rx="1" fill="#7F8C8D"/>
</svg>
