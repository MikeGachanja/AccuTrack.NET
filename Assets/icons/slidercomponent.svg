<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="sliderGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4a90e2"/>
            <stop offset="100%" style="stop-color:#357abd"/>
        </linearGradient>
        <filter id="dropShadow">
            <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2"/>
        </filter>
    </defs>
    <line x1="4" y1="12" x2="20" y2="12" stroke="#2c5c8f" stroke-width="1.5" filter="url(#dropShadow)"/>
    <rect x="10" y="8" width="4" height="8" fill="url(#sliderGradient)" rx="4" filter="url(#dropShadow)"/>
</svg>