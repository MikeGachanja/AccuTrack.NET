<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32"
    xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="gridGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#6c5ce7"/>
            <stop offset="100%" style="stop-color:#a29bfe"/>
        </linearGradient>
    </defs>
    <filter id="shadow">
        <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.1"/>
    </filter>
    <!-- Grid lines -->
    <g stroke="url(#gridGradient)" stroke-width="1.5" stroke-linecap="round" filter="url(#shadow)">
        <!-- Vertical lines -->
        <line x1="8" y1="6" x2="8" y2="26"/>
        <line x1="16" y1="6" x2="16" y2="26"/>
        <line x1="24" y1="6" x2="24" y2="26"/>
        <!-- Horizontal lines -->
        <line x1="6" y1="8" x2="26" y2="8"/>
        <line x1="6" y1="16" x2="26" y2="16"/>
        <line x1="6" y1="24" x2="26" y2="24"/>
    </g>
    <!-- Snap points (magnetic effect) -->
    <circle cx="8" cy="8" r="2" fill="#5a45e6" filter="url(#shadow)"/>
    <circle cx="16" cy="8" r="2" fill="#5a45e6" filter="url(#shadow)"/>
    <circle cx="24" cy="8" r="2" fill="#5a45e6" filter="url(#shadow)"/>
    <circle cx="8" cy="16" r="2" fill="#5a45e6" filter="url(#shadow)"/>
    <circle cx="16" cy="16" r="2" fill="#5a45e6" filter="url(#shadow)"/>
    <circle cx="24" cy="16" r="2" fill="#5a45e6" filter="url(#shadow)"/>
    <circle cx="8" cy="24" r="2" fill="#5a45e6" filter="url(#shadow)"/>
    <circle cx="16" cy="24" r="2" fill="#5a45e6" filter="url(#shadow)"/>
    <circle cx="24" cy="24" r="2" fill="#5a45e6" filter="url(#shadow)"/>
    <!-- Magnet icon -->
    <path d="M 20 4 L 22 4 L 22 6 L 20 6 Z" fill="#5a45e6"/>
    <path d="M 20 6 Q 21 6 21 7 Q 21 8 20 8 L 20 6" fill="#5a45e6"/>
</svg>
