<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" version="1.1"
	xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="neutralGradient" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" style="stop-color:#f8f8f8"/>
			<stop offset="100%" style="stop-color:#e0e0e0"/>
		</linearGradient>
		<filter id="dropShadow">
			<feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.2"/>
		</filter>
	</defs>
	<rect x="1" y="1" width="30" height="30" fill="url(#neutralGradient)" stroke="#cccccc" stroke-width="1.5" rx="4" filter="url(#dropShadow)"/>
	<text x="16" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#666666">SVG</text>
</svg>