<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Folder with tag/table icon -->
  <!-- Folder body -->
  <path d="M 20 25 L 20 70 L 80 70 L 80 35 L 55 35 L 50 25 Z" 
        fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
  <path d="M 20 25 L 50 25 L 55 35 L 20 35 Z" 
        fill="#27AE60" opacity="0.7"/>
  
  <!-- Folder tab -->
  <path d="M 25 25 L 45 25 L 50 30 L 25 30 Z" 
        fill="#58D68D" stroke="#27AE60" stroke-width="1"/>
  
  <!-- Tag table icon inside folder -->
  <rect x="32" y="42" width="36" height="22" rx="1" fill="#2C3E50" stroke="#1A252F" stroke-width="1.5"/>
  <line x1="40" y1="48" x2="40" y2="64" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="48" x2="50" y2="64" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="48" x2="60" y2="64" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="32" y1="54" x2="68" y2="54" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <line x1="32" y1="60" x2="68" y2="60" stroke="#7F8C8D" stroke-width="1" opacity="0.5"/>
  <circle cx="45" cy="57" r="2" fill="#2ECC71"/>
  <circle cx="55" cy="57" r="2" fill="#3498DB"/>
  
  <!-- Base -->
  <rect x="35" y="70" width="30" height="6" rx="1" fill="#7F8C8D"/>
</svg>
