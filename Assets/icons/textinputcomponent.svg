    </defs>
    <rect x="4" y="8" width="24" height="16" rx="4" fill="url(#blue-gradient)" stroke="#2c5c8f" stroke-width="1.5" filter="url(#shadow)"/>
    <line x1="8" y1="12" x2="8" y2="20" stroke="#2c5c8f" stroke-width="1.5"/>
</svg>