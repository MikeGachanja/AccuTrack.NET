<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32"
    xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="zoomGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#6c5ce7"/>
            <stop offset="100%" style="stop-color:#a29bfe"/>
        </linearGradient>
    </defs>
    <filter id="shadow">
        <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.1"/>
    </filter>
    <!-- Magnifying glass -->
    <circle cx="13" cy="13" r="7" fill="none" stroke="url(#zoomGradient)" stroke-width="2" stroke-linecap="round" filter="url(#shadow)"/>
    <line x1="19" y1="19" x2="24" y2="24" stroke="url(#zoomGradient)" stroke-width="2" stroke-linecap="round" filter="url(#shadow)"/>
    <!-- Reset arrow -->
    <path d="M 10 13 L 13 10 L 13 12 L 16 12" stroke="#5a45e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 10 13 L 13 16 L 13 14 L 16 14" stroke="#5a45e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
